<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AnimeForge AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background:
        radial-gradient(circle at top, #321052 0%, #090711 45%, #020207 100%);
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .header {
      text-align: center;
      padding: 35px 10px 25px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .logo span {
      color: #a855f7;
    }

    .subtitle {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 22px;
      backdrop-filter: blur(15px);
      box-shadow: 0 15px 50px rgba(0,0,0,0.35);
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-size: 14px;
      color: #ddd;
    }

    textarea {
      width: 100%;
      min-height: 160px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 16px;
      padding: 16px;
      color: white;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.1);
      font-size: 15px;
    }

    textarea::placeholder {
      color: #777;
    }

    textarea:focus {
      border-color: #a855f7;
      box-shadow: 0 0 20px rgba(168,85,247,0.2);
    }

    .generate-btn {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(90deg, #7c3aed, #a855f7);
      box-shadow: 0 8px 25px rgba(124,58,237,0.3);
      transition: 0.2s;
    }

    .generate-btn:hover {
      transform: translateY(-2px);
    }

    .generate-btn:active {
      transform: scale(0.98);
    }

    .status {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      text-align: center;
      background: rgba(168,85,247,0.1);
      color: #d8b4fe;
      font-size: 14px;
    }

    .result {
      display: none;
      margin-top: 22px;
    }

    .result h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }

    .result-box {
      min-height: 180px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.1);
      color: #ddd;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #666;
      font-size: 12px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 28px;
      }

      .container {
        padding: 15px 12px 40px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <div class="logo">
        Anime<span>Forge</span> AI
      </div>

      <p class="subtitle">
        Turn your imagination into an anime story
      </p>
    </header>

    <main class="card">

      <label for="prompt">
        Describe your anime idea
      </label>

      <textarea
        id="prompt"
        placeholder="Example: A boy meets a mysterious girl during a rainy evening in Tokyo..."
      ></textarea>

      <button class="generate-btn" onclick="generateAnime()">
        ✨ Generate Anime
      </button>

      <div class="status" id="status">
        Creating your anime...
      </div>

      <div class="result" id="result">
        <h2>Generated Result</h2>

        <div class="result-box" id="resultBox"></div>
      </div>

    </main>

    <div class="footer">
      AnimeForge AI • Powered by AI
    </div>

  </div>

  <script>

    async function generateAnime() {

      const prompt =
        document.getElementById("prompt").value.trim();

      const status =
        document.getElementById("status");

      const result =
        document.getElementById("result");

      const resultBox =
        document.getElementById("resultBox");

      if (!prompt) {
        alert("Please describe your anime first.");
        return;
      }

      status.style.display = "block";
      result.style.display = "none";

      try {

        const response = await fetch("/api/generate", {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            prompt: prompt
          })
        });

        if (!response.ok) {
          throw new Error("AI connection failed");
        }

        const data = await response.json();

        status.style.display = "none";
        result.style.display = "block";

        resultBox.textContent =
          data.result ||
          data.output ||
          "Anime generated successfully.";

      } catch (error) {

        status.style.display = "none";
        result.style.display = "block";

        resultBox.textContent =
          "AI backend is not connected yet.\n\n" +
          "Your prompt was received:\n\n" +
          prompt +
          "\n\nNext, we will connect the AI backend.";

      }

    }

  </script>

</body>
</html>
