<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnimeForge AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  color:white;
  background:#03030a;
}

/* LOADING SCREEN */
#loader{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#321052 0%,#090711 40%,#020207 100%);
  transition:1s;
}

#loader.hide{
  opacity:0;
  visibility:hidden;
}

.loaderLogo{
  font-size:35px;
  font-weight:900;
  letter-spacing:2px;
}

.loaderLogo span{
  color:#a855f7;
}

.ring{
  width:65px;
  height:65px;
  margin-top:30px;
  border:3px solid #ffffff18;
  border-top-color:#a855f7;
  border-right-color:#00d9ff;
  border-radius:50%;
  animation:spin 1s linear infinite;
  box-shadow:0 0 35px #9d5cff55;
}

.loadingText{
  margin-top:25px;
  font-size:11px;
  letter-spacing:4px;
  color:#aaa;
  animation:pulse 1s infinite;
}

.loadingBar{
  width:190px;
  height:3px;
  margin-top:18px;
  background:#ffffff15;
  overflow:hidden;
  border-radius:10px;
}

.loadingBar div{
  height:100%;
  width:0;
  background:linear-gradient(90deg,#a855f7,#00d9ff);
  animation:load 3s forwards;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

@keyframes pulse{
  50%{opacity:.3}
}

@keyframes load{
  to{width:100%}
}

/* HEADER */
header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid #ffffff12;
  background:#080812dd;
  backdrop-filter:blur(15px);
}

.logo{
  font-size:24px;
  font-weight:900;
}

.logo span{
  color:#a855f7;
}

/* HERO */
.hero{
  text-align:center;
  padding:60px 20px 30px;
}

.hero h1{
  font-size:clamp(38px,9vw,70px);
  line-height:1;
  background:linear-gradient(90deg,#fff,#a855f7,#00d9ff);
  -webkit-background-clip:text;
  color:transparent;
}

.hero p{
  margin-top:20px;
  color:#9999aa;
}

/* GENERATOR */
.generator{
  width:min(900px,92%);
  margin:30px auto;
  padding:25px;
  border-radius:24px;
  border:1px solid #ffffff15;
  background:#0b0b14dd;
  box-shadow:0 0 60px #7c3aed18;
}

label{
  display:block;
  margin-bottom:10px;
  color:#ddd;
  font-weight:bold;
}

textarea{
  width:100%;
  height:160px;
  resize:none;
  padding:17px;
  border-radius:15px;
  outline:none;
  border:1px solid #ffffff15;
  background:#05050a;
  color:white;
  font-size:15px;
}

textarea:focus{
  border-color:#a855f7;
}

.options{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:18px;
}

select{
  width:100%;
  padding:13px;
  border-radius:12px;
  border:1px solid #ffffff15;
  background:#05050a;
  color:white;
}

.generate{
  width:100%;
  margin-top:22px;
  padding:17px;
  border:0;
  border-radius:14px;
  color:white;
  font-weight:bold;
  font-size:16px;
  cursor:pointer;
  background:linear-gradient(90deg,#7c3aed,#06b6d4);
  box-shadow:0 0 30px #7c3aed44;
}

.generate:active{
  transform:scale(.98);
}

/* STATUS */
#status{
  display:none;
  text-align:center;
  margin-top:25px;
  padding:25px;
  border-radius:18px;
  background:#11111c;
}

.smallRing{
  width:38px;
  height:38px;
  margin:auto;
  border:3px solid #ffffff15;
  border-top-color:#a855f7;
  border-radius:50%;
  animation:spin 1s linear infinite;
}

#statusText{
  margin-top:15px;
  color:#bbb;
}

/* RESULT */
#result{
  display:none;
  margin-top:25px;
}

.preview{
  height:260px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  border-radius:18px;
  border:1px solid #ffffff15;
  background:
    linear-gradient(135deg,#241044,#062331);
  color:#77778a;
}

footer{
  text-align:center;
  padding:40px 20px;
  color:#666;
  font-size:12px;
}

@media(max-width:650px){
  .options{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<!-- LOADING -->
<div id="loader">
  <div class="loaderLogo">
    Anime<span>Forge</span>
  </div>

  <div class="ring"></div>

  <div class="loadingText">
    INITIALIZING AI
  </div>

  <div class="loadingBar">
    <div></div>
  </div>
</div>

<header>
  <div class="logo">
    Anime<span>Forge</span> AI
  </div>
</header>

<section class="hero">
  <h1>
    Turn Ideas<br>
    Into Anime
  </h1>

  <p>
    Create cinematic anime stories from your imagination.
  </p>
</section>

<div class="generator">

  <label>🎬 Describe Your Anime</label>

  <textarea id="prompt"
  placeholder="Example: A young boy walks through a Japanese city during heavy rain. Cherry blossom petals fly through the air. Cinematic anime movie style..."></textarea>

  <div class="options">

    <div>
      <label>🎨 Style</label>

      <select id="style">
        <option>Cinematic Anime</option>
        <option>Fantasy Anime</option>
        <option>Action Anime</option>
        <option>Romance Anime</option>
        <option>Dark Anime</option>
      </select>
    </div>

    <div>
      <label>📺 Format</label>

      <select id="format">
        <option>16:9 Cinematic</option>
        <option>9:16 Vertical</option>
        <option>1:1 Square</option>
      </select>
    </div>

    <div>
      <label>⏱️ Duration</label>

      <select id="duration">
        <option>5 Seconds</option>
        <option>10 Seconds</option>
        <option>15 Seconds</option>
        <option>30 Seconds</option>
      </select>
    </div>

  </div>

  <button class="generate" onclick="generateAnime()">
    ✨ GENERATE ANIME
  </button>

  <div id="status">

    <div class="smallRing"></div>

    <div id="statusText">
      Understanding your story...
    </div>

  </div>

  <div id="result">

    <div class="preview">
      🎬<br>
      AI VIDEO WILL APPEAR HERE
    </div>

  </div>

</div>

<footer>
  AnimeForge AI • Imagine. Create. Animate.
</footer>

<script>

window.addEventListener("load",function(){

  setTimeout(function(){

    document
      .getElementById("loader")
      .classList.add("hide");

  },3200);

});



async function generateAnime(){

  const prompt =
    document.getElementById("prompt").value.trim();

  if(!prompt){
    alert("Please describe your anime first.");
    return;
  }

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const statusText =
    document.getElementById("statusText");

  result.style.display = "none";
  status.style.display = "block";

  statusText.textContent = "Connecting to AI...";

  try{

    const data = await connectAI(prompt);

    status.style.display = "none";
    result.style.display = "block";

    document.querySelector(".preview").innerHTML =
      "<h3>AI Connected ✓</h3>" +
      "<p>" + data.prompt + "</p>";

  }catch(error){

    status.style.display = "none";

    alert(error.message);
async function connectAI(prompt){

  return {
    prompt: prompt
  };

}
</script>

</body>
</html>
